[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raizes-nordeste"
version = "0.1.0"
description = "API de operacao da rede Raizes do Nordeste"
requires-python = ">=3.13"
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "PyJWT==2.15.1", "python-dotenv==1.2.4"]

[project.optional-dependencies]
desenvolvimento = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]

[project.scripts]
raizes = "raizes.linha_comando:principal"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
raizes = ["infrastructure/migracoes/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["testes"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
